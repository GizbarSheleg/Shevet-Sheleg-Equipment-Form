<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e0d0c;
    --paper: #f5f0e8;
    --rust: #c84b2f;
    --sage: #4a6741;
    --sand: #d9cdb8;
    --cream: #ede8dc;
    --warn: #e07b39;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper); color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; position: relative; overflow-x: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(14,13,12,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(14,13,12,0.04) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }

  /* ── Topbar ── */
  .topbar {
    position: relative; z-index: 10;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 36px; height: 52px; border-bottom: 3px solid var(--rust);
  }
  .topbar-left { display: flex; align-items: center; gap: 20px; }
  .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.08em; }
  .topbar-title span { color: var(--rust); }
  .topbar-group-chip {
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    color: #aaa; display: flex; align-items: center; gap: 8px;
  }
  .topbar-group-chip strong { color: var(--paper); }
  .btn-signout {
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 3px 10px; border: 1px solid #555;
    color: #888; background: transparent; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-signout:hover { background: #333; color: var(--paper); }

  .btn-admin-open {
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 14px; border: 1px solid var(--warn); color: var(--warn);
    background: transparent; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .btn-admin-open:hover { background: var(--warn); color: var(--ink); }

  /* ── Layout ── */
  .layout {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 440px;
    min-height: calc(100vh - 52px);
  }

  /* ── LEFT: Posts ── */
  .posts-panel {
    border-right: 1.5px solid var(--sand);
    padding: 36px 32px; overflow-y: auto;
    max-height: calc(100vh - 52px);
  }

  .panel-label {
    font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
  }
  .panel-label::after { content: ''; flex: 1; height: 1px; background: var(--sand); }

  .visibility-tag {
    font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 99px;
    background: rgba(74,103,65,0.15); color: var(--sage); border: 1px solid var(--sage);
  }
  .visibility-tag.limited { background: rgba(200,75,47,0.1); color: var(--rust); border-color: var(--rust); }

  .posts-list { display: flex; flex-direction: column; gap: 14px; }

  .post-card {
    background: white; border: 1.5px solid var(--sand);
    padding: 18px 22px; position: relative;
    animation: postIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
    transition: border-color 0.15s;
  }
  @keyframes postIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .post-card:hover { border-color: var(--ink); }
  .post-card.own-post { border-left: 3px solid var(--rust); }
  .post-card.done {
    background: #fafafa; border-color: #e8e8e8; opacity: 0.55;
    transition: opacity 0.3s, border-color 0.3s;
  }
  .post-card.done:hover { opacity: 0.75; border-color: #ccc; }
  .post-card.done .post-group { color: #bbb; }
  .post-card.done .post-text { color: #aaa; text-decoration: line-through; text-decoration-color: #ccc; }
  .post-card.done .own-badge { color: #ccc; }

  .btn-done {
    flex-shrink: 0;
    background: none; border: 1px solid var(--sand); color: #bbb;
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 9px; cursor: pointer; white-space: nowrap;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .btn-done:hover { border-color: var(--sage); color: var(--sage); background: rgba(74,103,65,0.06); }
  .btn-done.marked { border-color: var(--sage); color: var(--sage); background: rgba(74,103,65,0.1); }
  .btn-done.marked:hover { border-color: var(--rust); color: var(--rust); background: rgba(200,75,47,0.06); }

  .own-badge {
    font-family: 'DM Mono', monospace; font-size: 9px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--rust); margin-bottom: 6px;
  }
  .post-meta { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .post-group { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.05em; color: var(--rust); }
  .post-time { font-family: 'DM Mono', monospace; font-size: 10px; color: #aaa; }
  .post-text { font-size: 13.5px; line-height: 1.65; color: #333; word-break: break-word; white-space: pre-wrap; }

  .locked-hint {
    text-align: center; padding: 36px 20px;
    border: 1.5px dashed var(--sand); background: rgba(217,205,184,0.15);
  }
  .locked-hint .lock { font-size: 36px; margin-bottom: 10px; }
  .locked-hint h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--ink); margin-bottom: 6px; }
  .locked-hint p { font-family: 'DM Mono', monospace; font-size: 10px; color: #bbb; letter-spacing: 0.08em; line-height: 1.7; }

  .empty-state { text-align: center; padding: 48px 0; color: var(--sand); }
  .empty-state .big-char { font-family: 'Bebas Neue', sans-serif; font-size: 64px; display: block; line-height: 1; margin-bottom: 10px; }
  .empty-state p { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── RIGHT: Form panel ── */
  .form-panel { padding: 36px 36px 48px; overflow-y: auto; max-height: calc(100vh - 52px); }
  .form-header { margin-bottom: 24px; }
  .form-header-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rust); margin-bottom: 6px; }
  .form-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 40px; line-height: 1; letter-spacing: 0.04em; }

  .form-card {
    background: var(--cream); border: 1.5px solid var(--ink);
    padding: 28px 32px 32px; position: relative; box-shadow: 4px 4px 0 var(--ink);
  }
  .form-card::before {
    content: '◆'; position: absolute; top: -11px; left: 28px;
    font-size: 18px; color: var(--rust); background: var(--cream); padding: 0 5px;
  }

  /* Group selector grid */
  .group-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px; margin-bottom: 22px;
  }
  .group-btn {
    padding: 10px 8px; border: 1.5px solid var(--sand);
    background: var(--paper); color: var(--ink);
    font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.04em;
    cursor: pointer; text-align: center;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .group-btn:hover { border-color: var(--ink); }
  .group-btn.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .group-btn.selected::after { content: ' ◆'; font-size: 11px; color: var(--rust); }

  .field { margin-bottom: 22px; }

  label {
    display: block; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); margin-bottom: 8px;
  }

  input[type="text"], input[type="password"], textarea {
    width: 100%; background: var(--paper); border: 1.5px solid var(--ink);
    padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
    outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none; border-radius: 0;
  }
  input:focus, textarea:focus { border-color: var(--rust); box-shadow: 3px 3px 0 var(--rust); }
  textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

  .char-counter { font-family: 'DM Mono', monospace; font-size: 10px; color: #999; text-align: right; margin-top: 5px; }
  .char-counter.warn { color: var(--warn); }
  .char-counter.over { color: var(--rust); }

  .security-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--sage); background: rgba(74,103,65,0.1); border: 1px solid var(--sage);
    padding: 4px 10px; margin-bottom: 20px;
  }
  .security-badge::before { content: '🔒'; font-size: 11px; }

  .threat-bar { height: 3px; background: var(--sand); margin-top: 5px; overflow: hidden; display: none; }
  .threat-fill { height: 100%; width: 0%; transition: width 0.3s; }
  .threat-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--rust); margin-top: 4px; display: none; }

  .btn-primary {
    width: 100%; background: var(--ink); color: var(--paper);
    border: none; padding: 14px; font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 0.1em; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s; box-shadow: 4px 4px 0 var(--rust);
  }
  .btn-primary:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--rust); }
  .btn-primary:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--rust); }
  .btn-primary:disabled { background: var(--sand); color: #aaa; cursor: not-allowed; box-shadow: none; transform: none; }

  /* ── Admin modal ── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(14,13,12,0.65); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--paper); border: 2px solid var(--ink);
    box-shadow: 8px 8px 0 var(--rust);
    width: 580px; max-width: 95vw; max-height: 88vh;
    display: flex; flex-direction: column;
    animation: modalIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .modal-header {
    background: var(--ink); color: var(--paper);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .modal-header h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.06em; }
  .modal-header h3 span { color: var(--warn); }

  .btn-close { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; line-height: 1; }
  .btn-close:hover { color: var(--paper); }

  .modal-tabs {
    display: flex; border-bottom: 1.5px solid var(--sand);
    background: var(--cream); flex-shrink: 0; overflow-x: auto;
  }
  .tab-btn {
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 11px 16px; border: none; background: none;
    color: #aaa; cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1.5px; transition: color 0.15s, border-color 0.15s; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--rust); border-bottom-color: var(--rust); }

  .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
  .modal-desc { font-family: 'DM Mono', monospace; font-size: 11px; color: #777; letter-spacing: 0.06em; line-height: 1.7; margin-bottom: 20px; }

  /* Admin login */
  .admin-login { display: flex; flex-direction: column; gap: 14px; }
  .btn-admin-submit {
    padding: 10px 20px; background: var(--ink); color: var(--paper); border: none;
    font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.08em;
    cursor: pointer; box-shadow: 3px 3px 0 var(--rust);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-admin-submit:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--rust); }

  /* Section head */
  .section-head {
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink); padding-bottom: 8px; border-bottom: 1px solid var(--sand); margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }

  /* Group password rows */
  .group-pw-list { display: flex; flex-direction: column; gap: 12px; }

  .group-pw-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--cream); border: 1px solid var(--sand);
  }
  .group-pw-name {
    font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.05em;
    color: var(--ink); min-width: 100px;
  }
  .group-pw-input { flex: 1; padding: 7px 10px; font-size: 13px; }
  .btn-set-pw {
    padding: 7px 14px; background: var(--sage); color: white; border: none;
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
  }
  .btn-set-pw:hover { opacity: 0.85; }

  /* Posts management */
  .admin-post-card {
    background: white; border: 1px solid var(--sand); padding: 12px 16px; margin-bottom: 10px;
  }
  .admin-post-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .admin-post-group { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: var(--rust); }
  .admin-post-meta { font-family: 'DM Mono', monospace; font-size: 10px; color: #aaa; margin-top: 2px; }
  .admin-post-text { font-size: 12px; color: #555; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  .btn-delete {
    flex-shrink: 0; background: none; border: 1px solid #ddd; color: #ccc;
    font-size: 12px; padding: 3px 8px; cursor: pointer;
    font-family: 'DM Mono', monospace; letter-spacing: 0.06em;
    transition: border-color 0.15s, color 0.15s, background 0.15s; white-space: nowrap;
  }
  .btn-delete:hover { border-color: var(--rust); color: var(--rust); background: rgba(200,75,47,0.06); }

  .group-btn.admin-group {
    border-color: var(--warn); color: var(--warn);
    font-size: 13px; letter-spacing: 0.06em;
  }
  .group-btn.admin-group:hover { background: rgba(224,123,57,0.08); border-color: var(--warn); }
  .group-btn.admin-group.selected { background: var(--warn); color: var(--ink); border-color: var(--warn); }
    background: none; border: 1px solid #ddd; color: #bbb;
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .btn-delete-all:hover { border-color: var(--rust); color: var(--rust); background: rgba(200,75,47,0.06); }

  /* Password / title shared section */
  .pw-section { display: flex; flex-direction: column; gap: 16px; }
  .pw-field { display: flex; flex-direction: column; gap: 6px; }
  .pw-field label { margin-bottom: 0; }
  .pw-strength { height: 3px; background: var(--sand); margin-top: 4px; overflow: hidden; }
  .pw-strength-fill { height: 100%; width: 0%; transition: width 0.3s, background 0.3s; }
  .pw-hint { font-family: 'DM Mono', monospace; font-size: 10px; color: #aaa; margin-top: 3px; }

  .btn-change-pw {
    padding: 12px; background: var(--ink); color: var(--paper); border: none;
    font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.08em;
    cursor: pointer; box-shadow: 3px 3px 0 var(--rust);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-change-pw:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--rust); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--ink); color: var(--paper);
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    padding: 10px 18px; transform: translateY(60px); opacity: 0;
    transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.3s;
    z-index: 300; pointer-events: none; box-shadow: 4px 4px 0 var(--rust);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error   { background: var(--rust); box-shadow: 4px 4px 0 var(--ink); }
  .toast.success { background: var(--sage); box-shadow: 4px 4px 0 var(--ink); }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .posts-panel { max-height: 45vh; border-right: none; border-bottom: 1.5px solid var(--sand); }
    .form-panel { max-height: none; }
    .topbar { padding: 0 16px; }
    .group-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title" id="topbarTitle">GROUP <span>BOARD</span></div>
    <div class="topbar-group-chip" id="topbarChip" style="display:none"></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span id="syncDot" title="Syncing…" style="width:7px;height:7px;border-radius:50%;background:var(--sage);opacity:0;transition:opacity 0.3s;flex-shrink:0"></span>
    <button class="btn-admin-open" onclick="openAdminModal()">⚙ Admin</button>
  </div>
</div>

<div class="layout">
  <!-- LEFT: Posts -->
  <div class="posts-panel">
    <div class="panel-label">
      Posts
      <span class="visibility-tag" id="visibilityTag">Sign in to see all</span>
    </div>
    <div class="posts-list" id="postsList"></div>
  </div>

  <!-- RIGHT: Form -->
  <div class="form-panel" id="formPanel"></div>
</div>

<!-- Admin modal -->
<div class="modal-backdrop" id="adminModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Admin <span>Panel</span></h3>
      <button class="btn-close" onclick="closeAdminModal()">✕</button>
    </div>
    <div class="modal-tabs" id="adminTabs" style="display:none">
      <button class="tab-btn active" id="tab-posts"    onclick="switchTab('posts')">📋 Posts</button>
      <button class="tab-btn"        id="tab-groups"   onclick="switchTab('groups')">🔑 Group Passwords</button>
      <button class="tab-btn"        id="tab-password" onclick="switchTab('password')">🛡 Admin Password</button>
      <button class="tab-btn"        id="tab-title"    onclick="switchTab('title')">🏷 Title</button>
      <button class="tab-btn"        id="tab-secret"   onclick="switchTab('secret')">🤫 Secret</button>
    </div>
    <div class="modal-body" id="adminModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════
let ADMIN_PASSWORD = 'admin123';
let SITE_TITLE = { part1: 'GROUP', part2: 'BOARD' };

// The groups and their passwords. isAdmin = full access to all posts & history.
const GROUPS = [
  { id: 'hay-banim', name: 'Hay Banim',  password: 'group1' },
  { id: 'hay-banot', name: 'Hay Banot',  password: 'group2' },
  { id: 'vav',       name: 'Vav',        password: 'group3' },
  { id: 'zine',      name: 'Zine',       password: 'group4' },
  { id: 'chet',      name: 'Chet',       password: 'group5' },
  { id: 'tet',       name: 'Tet',        password: 'group6' },
  { id: 'pelim',     name: 'Pelim',      password: 'group7' },
  { id: 'admins',    name: 'Admins',     password: 'admins123', isAdmin: true },
];

// ══════════════════════════════════════════════════════
//  ▼▼▼ PASTE YOUR X-MASTER-KEY HERE ▼▼▼
// ══════════════════════════════════════════════════════
const JSONBIN_KEY    = '$2a$10$fFqndGqialg0nfln.4CpU.YY.xDzDDKxNo5eNZSlVu634xu41Lt3q';
const JSONBIN_BIN_ID = '69ec4b91856a6821896e1fb1';
const JSONBIN_URL    = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
// ══════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
let posts = [];  // always a mirror of what's in JSONBin
const MY_SESSION_ID = Math.random().toString(36).slice(2);

// Currently signed-in group (id string or null)
let activeGroupId = null;

// Admin modal state
let adminAuthed = false;
let activeTab   = 'posts';
let isSyncing   = false; // prevent overlapping saves

// ══════════════════════════════════════════════════════
//  JSONBIN SYNC
// ══════════════════════════════════════════════════════

// Load all posts from JSONBin
async function loadPosts() {
  try {
    showSyncIndicator(true);
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!res.ok) throw new Error('Load failed');
    const data = await res.json();
    posts = data.record.posts || [];
    renderPosts();
    if (adminAuthed) renderAdminModal();
  } catch (e) {
    showToast('⚠ Could not load posts', 'error');
  } finally {
    showSyncIndicator(false);
  }
}

// Save current posts array back to JSONBin
async function savePosts() {
  if (isSyncing) return;
  isSyncing = true;
  try {
    showSyncIndicator(true);
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ posts })
    });
    if (!res.ok) throw new Error('Save failed');
  } catch (e) {
    showToast('⚠ Could not save post', 'error');
  } finally {
    isSyncing = false;
    showSyncIndicator(false);
  }
}

function showSyncIndicator(active) {
  const el = document.getElementById('syncDot');
  if (el) el.style.opacity = active ? '1' : '0';
}

// Poll for new posts every 8 seconds so all devices stay in sync
setInterval(async () => {
  if (document.hidden) return; // don't poll if tab is not visible
  await loadPosts();
}, 8000);

function isAdminGroup() { return activeGroup()?.isAdmin === true; }

// ══════════════════════════════════════════════════════
//  SQLi / XSS PROTECTION
// ══════════════════════════════════════════════════════
const SQLI_PATTERNS = [
  /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|TRUNCATE|EXEC|EXECUTE|UNION|FROM|WHERE|JOIN|HAVING|ORDER\s+BY|GROUP\s+BY|LIMIT|OFFSET)\b)/i,
  /--[\s\S]*/, /\/\*[\s\S]*?\*\//,
  /;\s*(DROP|DELETE|INSERT|UPDATE)/i,
  /'\s*(OR|AND)\s*'?\d/i,
  /'\s*(OR|AND)\s*'[^']*'='[^']*/i,
  /\b(CHAR|NCHAR|VARCHAR|NVARCHAR)\s*\(/i,
  /\bCAST\s*\(/i, /\bCONVERT\s*\(/i, /\bDECLARE\s+@/i,
  /xp_\w+/i, /0x[0-9a-fA-F]+/, /INFORMATION_SCHEMA/i, /sys\.(tables|columns|objects)/i,
];
function threatScore(text) {
  if (!text) return 0;
  let hits = 0;
  for (const p of SQLI_PATTERNS) if (p.test(text)) hits++;
  return Math.min(100, hits * 20);
}
function sanitize(raw) {
  let s = raw.trim().replace(/\0/g, '');
  s = s.replace(/--[\s\S]*/g, '').replace(/\/\*[\s\S]*?\*\//g, '').replace(/\s{3,}/g, '  ');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}

}

function renderPostForm(panel) {
  const g = activeGroup();
  panel.innerHTML = `
    <div class="form-header">
      <div class="form-header-label">${g.name}</div>
      <h2>Post a<br>Message</h2>
    </div>
    <div class="form-card">
      <div class="security-badge">Input sanitized · SQLi protected</div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write your message here…" maxlength="500"></textarea>
        <div class="char-counter" id="msgCounter">0 / 500</div>
        <div class="threat-bar" id="threatBar"><div class="threat-fill" id="threatFill"></div></div>
        <div class="threat-label" id="threatLabel"></div>
      </div>
      <button class="btn-primary" onclick="handleSubmit()">Post Message →</button>
    </div>`;

  const msgInput   = document.getElementById('message');
  const msgCounter = document.getElementById('msgCounter');

  msgInput.addEventListener('input', () => {
    const len = msgInput.value.length;
    msgCounter.textContent = `${len} / 500`;
    msgCounter.className = 'char-counter' + (len > 450 ? (len >= 500 ? ' over' : ' warn') : '');
    updateThreat(msgInput.value);
  });
  msgInput.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') handleSubmit();
  });
}

function updateThreat(text) {
  const bar = document.getElementById('threatBar');
  const fill = document.getElementById('threatFill');
  const lbl  = document.getElementById('threatLabel');
  if (!bar) return;
  const score = threatScore(text);
  if (score === 0) { bar.style.display = lbl.style.display = 'none'; return; }
  bar.style.display = lbl.style.display = 'block';
  fill.style.width = score + '%';
  lbl.textContent = score < 40 ? '⚠ Suspicious characters' : '🚫 Injection blocked';
  fill.style.background = score < 40 ? 'var(--warn)' : 'var(--rust)';
}

async function handleSubmit() {
  if (!activeGroupId) return;
  const m = document.getElementById('message');
  if (!m.value.trim()) { showToast('Message cannot be empty', 'error'); m.focus(); return; }
  if (threatScore(m.value) >= 40) { showToast('🚫 Injection attempt blocked', 'error'); return; }

  const g = activeGroup();
  posts.push({
    id:        Math.random().toString(36).slice(2),
    groupId:   activeGroupId,
    groupName: g.name,
    text:      sanitize(m.value),
    sessionId: MY_SESSION_ID,
    done:      false,
    time:      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
  });

  m.value = '';
  document.getElementById('msgCounter').textContent = '0 / 500';
  updateThreat('');
  renderPosts();
  showToast('✓ Posting…', 'success');
  await savePosts();
  showToast('✓ Message posted', 'success');
}

function setGroupPassword(groupId) {
  const input = document.getElementById('pw-' + groupId);
  const val   = input?.value?.trim();

  if (val.length < 3) { showToast('Password too short (min 3 chars)', 'error'); return; }

  g.password = val;

  if (activeGroupId === groupId) {

// ── Posts ──
async function deletePost(id) {
  const idx = posts.findIndex(p => p.id === id);
  if (idx === -1) return;
  posts.splice(idx, 1);
  renderPosts();
  renderAdminModal();
  showToast('✓ Post deleted', 'success');
  await savePosts();
}

async function deleteAllPosts() {
  if (!confirm(`Delete all ${posts.length} post${posts.length > 1 ? 's' : ''}? This cannot be undone.`)) return;
  posts.length = 0;
  renderPosts();
  renderAdminModal();
  showToast('✓ All posts deleted', 'success');
  await savePosts();
}

// ── Admin password ──
function updatePwStrength() {
  const pw   = document.getElementById('pwNew')?.value || '';
  const fill = document.getElementById('pwStrengthFill');
  const hint = document.getElementById('pwHint');
  if (!fill) return;
  let score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const pct    = [0,20,40,65,82,100][score];
  const colors = ['#ddd','var(--rust)','var(--warn)','#c8a92f','var(--sage)','var(--sage)'];
  const labels = ['','Weak','Fair','Good','Strong','Very strong'];
  fill.style.width      = pct + '%';
  fill.style.background = colors[score];
  hint.textContent      = pw.length === 0 ? 'Enter a new password' : labels[score];
  hint.style.color      = colors[score];
}

function changeAdminPassword() {
  const current = document.getElementById('pwCurrent')?.value || '';
  const nw      = document.getElementById('pwNew')?.value || '';
  const confirm = document.getElementById('pwConfirm')?.value || '';
  if (current !== ADMIN_PASSWORD) { showToast('Current password is wrong', 'error'); return; }
  if (!nw) { showToast('Enter a new password', 'error'); return; }
  if (nw.length < 6) { showToast('Min 6 characters', 'error'); return; }
  if (nw !== confirm) { showToast('Passwords do not match', 'error'); return; }
  ADMIN_PASSWORD = nw;
  showToast('✓ Admin password changed', 'success');
  ['pwCurrent','pwNew','pwConfirm'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  updatePwStrength();
}

// ── Title ──
function previewTitle() {
  const p1 = (document.getElementById('titlePart1')?.value || '').trim();
  const p2 = (document.getElementById('titlePart2')?.value || '').trim();
  const preview = document.getElementById('titlePreview');
  if (preview) preview.innerHTML = `${p1 || '…'} <span style="color:var(--rust)">${p2 || '…'}</span>`;
}

function applyTitle() {
  const p1 = (document.getElementById('titlePart1')?.value || '').trim();
  const p2 = (document.getElementById('titlePart2')?.value || '').trim();
  if (!p1 && !p2) { showToast('Enter at least one word', 'error'); return; }
  SITE_TITLE.part1 = p1;
  SITE_TITLE.part2 = p2;
  document.getElementById('topbarTitle').innerHTML = `${p1}${p1 && p2 ? ' ' : ''}<span>${p2}</span>`;
  document.title = [p1, p2].filter(Boolean).join(' ');
  showToast('✓ Title updated', 'success');
}

// ── Toggle done ──
async function toggleDone(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;
  post.done = !post.done;
  renderPosts();
  showToast(post.done ? '✓ Marked as done' : 'Marked as active', post.done ? 'success' : '');
  await savePosts();
}

renderTopbarChip();
renderPosts();
renderFormPanel();
loadPosts(); // fetch from JSONBin on startup
